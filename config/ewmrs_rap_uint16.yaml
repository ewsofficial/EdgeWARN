# ewmrs_rap_uint16.yaml — Audit §8 RAP uint16
#
# Source: src/EWMRS/rap/config.py; uint16_pipeline.py:101,264,287,348
# Values verified against the working tree at commit e12d407.
# Not yet consumed by code; see plans/yaml-configurations.md.

schema_version: 1

pressure_levels_mb:
  wind:   [925, 850, 700, 500, 250]
  thermo: [925, 850, 700, 500, 250]

max_timestamps: 3                       # timestamp dirs retained per layer
timestamp_format: '%Y%m%d-%H%M00'
scale_rule: 'rint((v - scale.min) / (scale.max - scale.min) * 65534)'  # nodata 65535

layers:                                 # {name, short_names, filter, units, scale, colormap_key}
  # --- near-surface ---
  - {name: RAP_Temperature_2m,   short_names: [2t, t, t2m], filter: {typeOfLevel: heightAboveGround, level: 2},  units: K,      scale: {min: 180.0, max: 330.0}, colormap_key: RAP_Temperature_LL}
  - {name: RAP_Dewpoint_2m,      short_names: [2d, d2m, dpt], filter: {typeOfLevel: heightAboveGround, level: 2}, units: K,     scale: {min: 180.0, max: 330.0}, colormap_key: RAP_Dewpoint_2m}
  - {name: RAP_UWind_10m,        short_names: [10u, u10, u], filter: {typeOfLevel: heightAboveGround, level: 10}, units: m s-1, scale: {min: -80.0, max: 80.0},  colormap_key: RAP_Wind_LL}
  - {name: RAP_VWind_10m,        short_names: [10v, v10, v], filter: {typeOfLevel: heightAboveGround, level: 10}, units: m s-1, scale: {min: -80.0, max: 80.0},  colormap_key: RAP_Wind_LL}
  # --- surface and precip ---
  - {name: RAP_Temperature_Surface,          short_names: [t],     filter: {typeOfLevel: surface, level: 0}, units: K,       scale: {min: 180.0, max: 330.0},     colormap_key: RAP_Temperature_LL}
  - {name: RAP_RelativeHumidity_2m,          short_names: [2r, r], filter: {typeOfLevel: heightAboveGround, level: 2}, units: '%', scale: {min: 0.0, max: 100.0}, colormap_key: RAP_RelativeHumidity}
  - {name: RAP_ThetaE_Surface,               short_names: [papt],  filter: {typeOfLevel: surface, level: 0}, units: K,       scale: {min: 250.0, max: 390.0},     colormap_key: RAP_ThetaE_Surface}
  - {name: RAP_MSLP_Surface,                 short_names: [prmsl], filter: {typeOfLevel: surface, level: 0}, units: Pa,      scale: {min: 95000.0, max: 105000.0}, colormap_key: null}
  - {name: RAP_SnowWaterEquivalent_Surface,  short_names: [sdwe],  filter: {typeOfLevel: surface, level: 0}, units: kg m-2,  scale: {min: 0.0, max: 200.0},       colormap_key: RAP_SnowWaterEquivalent_Surface}
  - {name: RAP_SnowDepth_Surface,            short_names: [sde],   filter: {typeOfLevel: surface, level: 0}, units: m,       scale: {min: 0.0, max: 5.0},         colormap_key: RAP_SnowDepth_Surface}
  - {name: RAP_WetBulbZeroHeight,            short_names: [gh],    filter: {typeOfLevel: lowestLevelWetBulb0, level: 0}, units: gpm, scale: {min: 0.0, max: 6000.0}, colormap_key: RAP_WetBulbZeroHeight}
  - {name: RAP_FreezingLevelHeight,          short_names: [gh],    filter: {typeOfLevel: isothermZero, level: 0}, units: gpm,     scale: {min: 0.0, max: 6000.0}, colormap_key: RAP_FreezingLevelHeight}
  # --- instability and shear ---
  - {name: RAP_CAPE_Surface,   short_names: [cape], filter: {typeOfLevel: surface, level: 0},                     units: J kg-1, scale: {min: 0.0, max: 6000.0},     colormap_key: RAP_CAPE}
  - {name: RAP_CIN_Surface,    short_names: [cin],  filter: {typeOfLevel: surface, level: 0},                     units: J kg-1, scale: {min: -1000.0, max: 0.0},    colormap_key: RAP_CIN_Surface}
  - {name: RAP_MLCAPE,         short_names: [cape], filter: {typeOfLevel: pressureFromGroundLayer, level: 9000},  units: J kg-1, scale: {min: 0.0, max: 6000.0},     colormap_key: RAP_CAPE}
  - {name: RAP_MLCIN,          short_names: [cin],  filter: {typeOfLevel: pressureFromGroundLayer, level: 9000},  units: J kg-1, scale: {min: -1000.0, max: 0.0},    colormap_key: RAP_MLCIN}
  - {name: RAP_MUCAPE,         short_names: [cape], filter: {typeOfLevel: pressureFromGroundLayer, level: 25500}, units: J kg-1, scale: {min: 0.0, max: 6000.0},     colormap_key: RAP_CAPE}
  - {name: RAP_MUCIN,          short_names: [cin],  filter: {typeOfLevel: pressureFromGroundLayer, level: 25500}, units: J kg-1, scale: {min: -1000.0, max: 0.0},    colormap_key: RAP_MUCIN}
  - {name: RAP_CAPE_0_3km,     short_names: [cape], filter: {typeOfLevel: heightAboveGroundLayer, level: 0},      units: J kg-1, scale: {min: 0.0, max: 6000.0},     colormap_key: RAP_CAPE}
  - {name: RAP_SRH_0-3km,      short_names: [hlcy], filter: {typeOfLevel: heightAboveGroundLayer, level: 3000},   units: m2 s-2, scale: {min: -500.0, max: 1000.0},  colormap_key: RAP_SRH}
  - {name: RAP_SRH_0-1km,      short_names: [hlcy], filter: {typeOfLevel: heightAboveGroundLayer, level: 1000},   units: m2 s-2, scale: {min: -500.0, max: 1000.0},  colormap_key: RAP_SRH}
  - {name: RAP_LiftedIndex_Surface_500_1000mb, short_names: [lftx], filter: {typeOfLevel: isobaricLayer, level: 500}, units: K, scale: {min: -15.0, max: 15.0},      colormap_key: RAP_LiftedIndex_Surface_500_1000mb}
  - {name: RAP_AbsoluteVorticity_500mb,        short_names: [absv], filter: {typeOfLevel: isobaricInhPa, level: 500}, units: s-1, scale: {min: -0.0002, max: 0.0002}, colormap_key: RAP_AbsoluteVorticity_500mb}
  # --- isobaric thermo: generated for each thermo level ---
  # RAP_Temperature_{L}mb       short [t], K,   180.0..330.0, colormap RAP_Temperature_LL (925/850/700) or RAP_Temperature_HL (500/250)
  # RAP_RelativeHumidity_{L}mb  short [r], '%', 0.0..100.0,   colormap RAP_RelativeHumidity
  # --- isobaric wind: generated for each wind level ---
  # RAP_UWind_{L}mb / RAP_VWind_{L}mb  short [u]/[v], m s-1, -80.0..80.0,
  #   colormap RAP_Wind_LL (925/850), RAP_Wind_ML (700/500), RAP_Wind_HL (250)
