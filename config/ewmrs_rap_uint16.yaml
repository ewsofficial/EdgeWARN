# ewmrs_rap_uint16.yaml — EWMRS RAP Uint16 conversion policy
#
# Source: src/EWMRS/rap/config.py; uint16_pipeline.py
#
# Layer definitions remain code-owned because they encode derived output paths
# and pressure-level colormap rules. Only runtime conversion policy belongs here.

schema_version: 1

# Shared by published indexes and on-disk cleanup, preventing indexes from
# advertising timestamp directories that cleanup has removed.
max_timestamps: 3

# strftime pattern for per-timestamp output directories.
timestamp_format: '%Y%m%d-%H%M00'

# Re-encode layers whose output already exists when no explicit caller choice is
# supplied.
force: false
