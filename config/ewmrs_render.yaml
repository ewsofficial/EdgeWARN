goes_transform:                         # render/goes_transform.py
  resampling: bilinear                  # goes_transform.py:370
  # CRS extraction (from_cf, then a +proj=geos from_proj4 reconstruction) and
  # radian-vs-metre axis detection are algorithms, not settings; they stay in
  # goes_transform.py:65-95 and :243-244.

nexrad_gui:
  variable_colormaps:                   # nexrad.py:53-60
    DBZH: NWS_Reflectivity
    VRADH: VRADH
    WRADH: WRADH
    PHIDP: PHIDP
    RHOHV: RHOHV
    ZDR: ZDR
  field_magic: EWFFv1S0                 # nexrad.py:52; wire-format invariant
  bin_name_pattern: '{site_upper}_{variable_name}_{elevation_label}_{scan_timestamp}.bin.gz'  # nexrad.py:112
  manifest_name_pattern: '{site_upper}_{scan_timestamp}_{volume_id}.json'  # nexrad.py:391,441
  manifest_timestamp_fallback: unknown  # nexrad.py:441 (manifest_timestamp or 'unknown')
