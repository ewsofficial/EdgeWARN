goes_transform:                         # render/goes_transform.py
  # Resolved to a rasterio.enums.Resampling member by render/config.py
  # goes_transform_resampling(), which both reprojection entry points defer to
  # via a `resampling=None` parameter. It used to be a signature default on each
  # of them AND an explicit argument at the one live call site, so this key was
  # outvoted three times over.
  #
  # Owns the GOES ABI path only. EWMRS/pipeline.py reprojects the non-GOES layers
  # with `nearest` on purpose, to keep radar edges crisp -- a different policy,
  # deliberately not this key, and not a copy that drifted.
  #
  # The schema enum omits `gauss`, which rasterio defines but does not accept for
  # warping. The accessor re-checks against rasterio.warp.SUPPORTED_RESAMPLING
  # anyway, because that list belongs to a different project than this schema.
  resampling: bilinear
  # CRS extraction (from_cf, then a +proj=geos from_proj4 reconstruction) and
  # radian-vs-metre axis detection are algorithms, not settings; they stay in
  # goes_transform.py.

nexrad_gui:
  # The sole owner, and the only key in this block a code path reads:
  # render/config.py nexrad_variable_colormaps(), called by render/nexrad.py once
  # per serialization and hoisted above the per-sweep loop. The renderer used to
  # restate this as a module constant, which made editing here change nothing the
  # GUI drew.
  #
  # A moment omitted here is still served by the API; it just goes undrawn. CCORH
  # is deliberately that case -- see test_ccorh_is_servable_but_deliberately_uncolored.
  variable_colormaps:
    DBZH: NWS_Reflectivity
    VRADH: VRADH
    WRADH: WRADH
    PHIDP: PHIDP
    RHOHV: RHOHV
    ZDR: ZDR
