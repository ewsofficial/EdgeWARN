# ewmrs_render.yaml — Audit §8 render
#
# Source: src/EWMRS/render/{config,render,tiler,tools,goes_transform,nexrad}.py
# Values verified against the working tree at commit e426fb2.
# Every block below is wired, by one of two mechanisms. `mrms_layers`,
# `goes_layers`, `goes_transform` and `nexrad_gui` are read per call through the
# render/config.py accessor named at each block. `tiles` and `chunk_format` are
# the exception: they bind module constants at config.py:63-77, because they are
# wire-format invariants rather than operator settings and so have nothing to
# gain from following a late --config-dir.
#
# Worker/thread and cache sizing live in ewmrs_pipeline.yaml, which owns all
# EWMRS concurrency knobs.

schema_version: 1

tiles:
  # config.py:63-64. Pixels. render.py:176-182 requires the rendered dimensions to
  # be an exact multiple of it and raises rather than padding, so this is not a
  # free knob: it must divide every layer's grid.
  tile_size: 350

# config.py:68-77, republished to clients by chunk_format_descriptor (:80-101) and
# stamped into both index levels at render.py:311-314,350-353. Wire-format
# invariant, NOT operator-tunable.
chunk_format:
  wire_version: 2                       # CHUNK_SCHEMA_VERSION
  format_version: 2                     # CHUNK_FORMAT_VERSION
  encoding: float16
  data_type: float16
  channels: 1
  value_kind: scalar
  no_data: nan                          # the literal string "nan", not a float
  file_suffix: .f16.gz
  compression: gzip
  media_type: application/octet-stream
  bytes_per_component: 2
  pixel_row_order: top_to_bottom
  grid_origin: bottom_left
# config.py get_mrms_file_list(), 15 entries. `filepath` (ingest source) and
# `outdir` (render target) are util.file attribute names resolved by getattr at
# call time; an unknown name is a startup error. Note MRMS_VILDensity maps
# MRMS_DVIL_DIR -> GUI_VILD_DIR -- the names are deliberately asymmetric.
mrms_layers:
  - {name: MRMS_MergedReflectivityQC,         colormap_key: NWS_Reflectivity, filepath: MRMS_COMPOSITE_DIR,   outdir: GUI_COMPOSITE_DIR}
  - {name: MRMS_EchoTop18,                    colormap_key: EnhancedEchoTop,  filepath: MRMS_ECHOTOP18_DIR,   outdir: GUI_ECHOTOP18_DIR}
  - {name: MRMS_EchoTop30,                    colormap_key: EnhancedEchoTop,  filepath: MRMS_ECHOTOP30_DIR,   outdir: GUI_ECHOTOP30_DIR}
  - {name: MRMS_ReflectivityAtLowestAltitude, colormap_key: NWS_Reflectivity, filepath: MRMS_RALA_DIR,        outdir: GUI_RALA_DIR}
  - {name: MRMS_ReflectivityAt0C,             colormap_key: NWS_Reflectivity, filepath: MRMS_REF_0C_DIR,      outdir: GUI_REF_0C_DIR}
  - {name: MRMS_ReflectivityAtM5C,            colormap_key: NWS_Reflectivity, filepath: MRMS_REFM5C_DIR,      outdir: GUI_REFM5C_DIR}
  - {name: MRMS_ReflectivityAtM15C,           colormap_key: NWS_Reflectivity, filepath: MRMS_REFM15C_DIR,     outdir: GUI_REFM15C_DIR}
  - {name: MRMS_PrecipRate,                   colormap_key: PrecipRate,       filepath: MRMS_PRECIPRATE_DIR,  outdir: GUI_PRECIPRATE_DIR}
  - {name: MRMS_VILDensity,                   colormap_key: VILDensity,       filepath: MRMS_DVIL_DIR,        outdir: GUI_VILD_DIR}
  - {name: MRMS_QPE,                          colormap_key: QPE_01H,          filepath: MRMS_QPE_DIR,         outdir: GUI_QPE_DIR}
  - {name: MRMS_VIL,                          colormap_key: VIL,              filepath: MRMS_VIL_DIR,         outdir: GUI_VIL_DIR}
  - {name: MRMS_VII,                          colormap_key: VIL,              filepath: MRMS_VII_DIR,         outdir: GUI_VII_DIR}
  - {name: MRMS_MergedAzShear_0-2kmAGL,       colormap_key: AzShear,          filepath: MRMS_AZSHEARLOW_DIR,  outdir: GUI_AZSHEARLOW_DIR}
  - {name: MRMS_MergedAzShear_3-6kmAGL,       colormap_key: AzShear,          filepath: MRMS_AZSHEARMID_DIR,  outdir: GUI_AZSHEARMID_DIR}
  - {name: MRMS_MESH,                         colormap_key: MESH,             filepath: MRMS_MESH_DIR,        outdir: GUI_MESH_DIR}

# config.py get_goes_file_list(), 16 entries, one per ABI channel.
# `mask_min`/`mask_max` are keyed by the layer's channel id.
goes_layers:
  # config.py:137, spread onto every layer at :144-146 by get_goes_file_list().
  common:
    source_type: goes_abi
    variable_name: CMI
    fallback_variable_names: [Rad]
  layers:
    - name: GOES_ABI_C01_Reflectance
      channel_id: C01
      colormap_key: GOES_RGB_Raw
      value_transform: reflectance_from_rad
      filepath: GOES_ABI_VISIBLE_BLUE_DIR
      outdir: GUI_GOES_C01_DIR
      mask_min: {C01: 0.0}
      mask_max: {C01: 1.2}
    - name: GOES_ABI_C02_Reflectance
      channel_id: C02
      colormap_key: GOES_RGB_Raw
      value_transform: reflectance_from_rad
      filepath: GOES_ABI_VISIBLE_RED_DIR
      outdir: GUI_GOES_C02_DIR
      mask_min: {C02: 0.0}
      mask_max: {C02: 1.2}
    - name: GOES_ABI_C03_Reflectance
