# filesystem.yaml — Audit §7 Filesystem
#
# Source: src/util/file.py:21-28,64,133,182-186,195-200,203-248,251-257,282-295,
#         316-328; src/api/config/index.js:55-58;
#         src/EdgeWARN/process/detect/main.py:105
# Values verified against the working tree at commit e426fb2.
# Not yet consumed by code; see plans/source-configuration-extraction-plan.md.

schema_version: 1

# file.py:194-200. Chosen by platform at import time, not configured: the posix
# branch is `Path.home() / "EdgeWARN_input"`, and container_fallback is reached
# only if that raises.
base_dir:
  windows: 'C:\EdgeWARN_input'
  posix: ~/EdgeWARN_input
  container_fallback: /workspaces/EdgeWARN_input

# file.py:282 clean_old_files signature. clean_files_by_age (:316) takes
# max_age_minutes only.
cleanup_defaults:
  max_age_minutes: 60
  max_files: 10

  # Applies to clean_old_files only, which skips `.idx` unconditionally
  # (file.py:295). The three cleaners are NOT interchangeable:
  # clean_files_by_age (:316) does delete `.idx` -- it filters non-files and
  # nothing else (:326-328) -- and clean_idx_files (:251-257) deletes them
  # recursively via rglob but has no caller anywhere in the repo.
  skip_extensions: ['.idx']

  # detect/main.py:105 calls clean_files_by_age(fs.STORMCELL_DIR,
  # max_age_minutes=120), the one live caller that overrides the 60 above. It is
  # recorded as detection.yaml's `stormcell_cleanup_max_age_minutes` because the
  # owner is the detector, not the filesystem layer. Noted here so the 60 is not
  # mistaken for a global ceiling. (metar.py:395,441 pass 60 explicitly;
  # mrms/downloader.py:173 passes per-product values.)

# latest_files (file.py:203-248; the skip rules are at :234 and :236). Two
# different rules, deliberately split: the old single `skip_extensions` list read
# as though both were conditional.
scan:
  skip_extensions_always: ['.idx']              # file.py:234, no condition
  # file.py:236 -- dropped only when the same name without `.gz` is also in the
  # directory, so a lone `.gz` IS returned.
  skip_extensions_when_base_present: ['.gz']

# file.py:182-186 _find_existing_path. First existing candidate wins.
colormaps:
  search_path:
    - <cwd>/colormaps.json                      # Path.cwd(), file.py:183
    # file.py:184 is parents[1] of src/util/file.py -- resolved from the module,
    # not from the working directory, so this candidate is stable across cwds.
    - <src_dir>/EWMRS/colormaps.json
    - <gui_dir>/colormaps.json                  # base_dir/gui, file.py:64,133

  # When nothing exists, _find_existing_path returns Path(candidates[0])
  # (file.py:28) -- the cwd candidate, not a bare relative name. The string
  # 'colormaps.json' appears only in the warning text at file.py:186.
  fallback: <cwd>/colormaps.json

# NODE ONLY. src/api/config/index.js:57-58 reads both names (BASE_DIR is the
# deprecated alias) and :55-56 accepts --base-dir/--base_dir; conflicting values
# raise at :60. util/file.py reads no environment variable at all -- Python
# reconfiguration goes through initialize_filesystem(base_dir) (file.py:189).
env_overrides:
  base_dir: ['EDGEWARN_BASE_DIR', 'BASE_DIR']
