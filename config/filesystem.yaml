# filesystem.yaml — Audit §7 Filesystem
#
# Source: src/util/file.py:17-28,36-43,79,197-201,204,209-215,218-263,266-284,
#         297-334,336-357; src/api/config/index.js:55-58;
#         src/EdgeWARN/process/detect/main.py:101-104
#
# Line citations below name the anchor they were recomputed from, not an offset
# from an earlier revision. util/file.py has shifted ~20-40 lines since these were
# first written; a citation that points at the wrong function is worse than none.
#
# `cleanup_defaults` is consumed through src/util/file_config.py, which reads this
# file per call so a --config-dir resolved after import still applies. The other
# sections are documentation only, for the reasons given at each of them.

schema_version: 1

# The fallback every cleaner in util/file.py resolves to when its caller passes
# nothing. clean_files_by_age takes max_age_minutes only, so max_files reaches
# clean_old_files alone.
#
# max_files is resolved from a sentinel rather than from `None`, because `None` is
# already a value there: it means "age only, no count cap", which the RAP
# pre-download sweep passes deliberately. Raising max_files here does not raise it
# for callers that pass their own, and does not affect that uncapped pass at all.
cleanup_defaults:
  max_age_minutes: 60
  max_files: 10

  # detect/main.py:101-104 calls clean_files_by_age(fs.STORMCELL_DIR,
  # max_age_minutes=...), the one live caller that overrides the 60 above. It is
  # recorded as detection.yaml's `stormcell_cleanup_max_age_minutes` because the
  # owner is the detector, not the filesystem layer. Noted here so the 60 is not
  # mistaken for a global ceiling. (metar.py:413,457 pass this key's own accessor
  # rather than a literal; common/ingest/mrms/downloader.py:195,208 pass
  # per-product values.)

# NODE ONLY. src/api/config/index.js:57-58 reads both names (BASE_DIR is the
# deprecated alias) and :55-56 accepts --base-dir/--base_dir; conflicting values
# raise at :60. util/file.py reads no environment variable at all -- Python
# reconfiguration goes through initialize_filesystem(base_dir) (file.py:204).
env_overrides:
  base_dir: ['EDGEWARN_BASE_DIR', 'BASE_DIR']
