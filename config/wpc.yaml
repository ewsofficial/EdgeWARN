# wpc.yaml — Audit §7 WPC
#
# This file owns every value below. They are read through the accessors in
# src/common/ingest/wpc/config.py, which the downloader, converter, and ingest
# entry point call per use -- no module constants remain.

schema_version: 1

wpc:
  coded_sfc_base_url: https://ftp.wpc.ncep.noaa.gov/coded_sfc

  # WPC publishes every 3 hours, and `valid_hours` is that interval enumerated by
  # hand. Nothing derives one from the other, so a changed interval with a stale
  # list would request hours WPC never publishes; a drift guard couples them.
  update_interval_hours: 3
  valid_hours: [0, 3, 6, 9, 12, 15, 18, 21]
  http_timeout_seconds: 30

  # SECURITY: this key pins verification on, it does not offer to turn it off.
  # The schema fixes it to `true` and the downloader raises if it ever reads
  # false, so loosening either fails loudly rather than silently downgrading the
  # connection. Unlike metar.yaml, WPC has never skipped verification.
  verify_tls: true

  # URL and output naming. `codsus` is the WPC product code; the date directory
  # and the local GeoJSON name use the same %Y%m%d stamp but different shapes.
  date_format: '%Y%m%d'
  remote_filename_pattern: 'codsus{hour:02d}_hr'
  output_filename_pattern: 'wpc_sfc_{date}-{hour:02d}0000.geojson'
  latest_filename: latest.geojson

  # The retention sweep matches `output_filename_pattern` but not
  # `latest_filename`, so the file the API serves is never deleted. Three
  # different string shapes have to agree here and no schema can check it.
  cleanup_glob: 'wpc_sfc_*.geojson'
  # WPC's own window: inheriting filesystem.yaml's 60 would keep almost nothing,
  # since a 3-hourly product would be swept before its successor arrived.
  cleanup_max_age_minutes: 360
  # Each run also backfills the previous analysis, so a missed cycle self-heals.
  previous_analysis_lookback_hours: 3

  # Used when a parsed feature code is absent from `feature_types`; the label
  # falls back to the raw code itself, so a dropped entry renders unnamed and
  # black rather than failing. A baseline snapshot guards the table for that
  # reason.
  fallback_geojson_color: '#000000'
  feature_types:
    COLD:  {name: Cold Front,        color: '#0000FF'}
    WARM:  {name: Warm Front,        color: '#FF0000'}
    STNRY: {name: Stationary Front,  color: '#800080'}
    OCFNT: {name: Occluded Front,    color: '#800080'}
    TROF:  {name: Trough,            color: '#8B4513'}
    HIGH:  {name: High Pressure,     color: '#0000FF'}
    LOW:   {name: Low Pressure,      color: '#FF0000'}
