# WPC ingest defaults. File naming values are shared with the API and should be changed together.

schema_version: 1

# WPC surface-analysis source and output settings.
wpc:
  coded_sfc_base_url: https://ftp.wpc.ncep.noaa.gov/coded_sfc

  # Must divide 24 because WPC analyses are aligned to a fixed daily schedule.
  update_interval_hours: 3
  http_timeout_seconds: 30

  # Keep true; the downloader rejects insecure production operation.
  verify_tls: true

  date_format: '%Y%m%d'
  # Remote product naming; change only if WPC changes its publication format.
  remote_filename_pattern: 'codsus{hour:02d}_hr'
  # Writer format shared with cleanup; keep synchronized with prefix/suffix below.
  output_filename_pattern: 'wpc_sfc_{date}-{hour:02d}0000.geojson'
  latest_filename: latest.geojson

  # API reader contract; update with output naming only in a coordinated change.
  surface_filename_prefix: wpc_sfc_
  surface_filename_suffix: .geojson

  cleanup_glob: 'wpc_sfc_*.geojson'
  # Six hours retains at least the current and prior 3-hour analyses.
  cleanup_max_age_minutes: 360
  previous_analysis_lookback_hours: 3

  # Used only for unknown WPC feature codes; add a feature type when possible.
  fallback_geojson_color: '#000000'
  # Display mapping for WPC codes; preserve codes and use valid CSS hex colors.
  feature_types:
    COLD:  {name: Cold Front,        color: '#0000FF'}
    WARM:  {name: Warm Front,        color: '#FF0000'}
    STNRY: {name: Stationary Front,  color: '#800080'}
    OCFNT: {name: Occluded Front,    color: '#800080'}
    TROF:  {name: Trough,            color: '#8B4513'}
    HIGH:  {name: High Pressure,     color: '#0000FF'}
    LOW:   {name: Low Pressure,      color: '#FF0000'}
