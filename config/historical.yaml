# historical.yaml — Audit §1
#
# `lat`, `lon` and `output` are consumed through `IOManager.get_historical_args`,
# which overlays them onto CLI flags so a flag still outranks this file. The
# remaining keys have no flag and are consumed through
# src/EdgeWARN/historical_config.py. Every key below is the single owner of its
# default; no literal in the replay loop competes with it. Values are unchanged
# from the pre-extraction literals.
#
# `start` and `end` are deliberately absent: `get_historical_args` declares both
# flags `required=True` with no default, so a YAML value could never be reached.
# They were recorded as `null` placeholders, which is exactly the inert-key
# hazard this migration is meant to remove.

schema_version: 1

historical:
  lat: [20, 55]
  lon: [-130, -60]
  output: stormcell_test.json
  # Cursor advance per replay iteration in process_historical.py, applied on every
  # branch of the scan loop.
  step_minutes: 1
  # Only iterations that reach the pipeline sleep; the two early `continue`
  # branches skip it, so a long run of already-processed timestamps is not
  # throttled at all.
  throttle_seconds: 1

  # _cleanup_historical_data_dirs passes this to clean_old_files as max_files
  # only, so filesystem.yaml's max_age_minutes still applies on top of it -- a
  # directory is trimmed to this many files AND anything older than that budget is
  # dropped. Applied to ingest data directories only; protected_dirs are skipped.
  cleanup_max_files: 5
