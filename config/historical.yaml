# Historical replay defaults. Keep the one-minute cadence unless intentionally downsampling.

schema_version: 1

historical:
  # CONUS processing bounds; use a smaller region to reduce replay cost.
  lat: [20, 55]
  lon: [-130, -60]
  # One minute matches MRMS cadence; larger steps intentionally skip scans.
  step_minutes: 1
  # Small pause protects upstream services during long replays.
  throttle_seconds: 1

  cleanup_max_files: 5
