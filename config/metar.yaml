# METAR ingest defaults. Keep TLS verification enabled and use the configured public endpoints.

schema_version: 1

metar:
  # Authoritative station metadata source.
  station_db_url: https://aviationweather.gov/data/cache/stations.cache.json
  station_cache_file: stations_cache.json
  observation_url_pattern: 'https://tgftp.nws.noaa.gov/data/observations/metar/cycles/{hour}Z.TXT'

  station_timeout_seconds: 60
  observation_timeout_seconds: 30

  accept_encoding: 'gzip, deflate'

  # Keep true; disabling TLS verification is not supported for normal operation.
  verify_tls: true

  # Search window for delayed observations; larger values increase stale-data risk.
  lookback_hours: 3
  cleanup_max_age_minutes: 60
  coordinate_decimals: 4
  pressure_decimals: 2

  # Geographic filter for rendered observations; expand only when supporting another domain.
  conus_bounds:
    lat_min: 24.0
    lat_max: 50.0
    lon_min: -125.0
    lon_max: -66.0
