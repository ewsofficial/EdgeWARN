# detection.yaml — Audit §4
#
# Source: src/EdgeWARN/process/detect/main.py:29-31,100-105,253,333-340,358-368,390;
#         track.py:65,186; tools/gatemapper.py:119-122,244,287,332,341-346,368-374;
#         tools/morphology.py:14,66,97; tools/save.py:148,169,174,230,252,256,423;
#         tools/alert_matcher.py:31-41,438,441,468,469
# Values verified against the working tree at commit e426fb2.
# Not yet consumed by code; see plans/source-configuration-extraction-plan.md.
#
# Five keys are deliberately absent from `gatemapper`, all of them pieces of one
# hardcoded expression rather than settings:
#
#   baseline_refl_floor      gatemapper.py:101 is `min(37.5, self.refl_threshold)`.
#                            37.5 is a ceiling on `refl_threshold`, not an
#                            independent value -- raising refl_threshold cannot
#                            raise the baseline, and editing 37.5 alone does
#                            nothing whenever refl_threshold is lower.
#   dynamic_min_threshold    switch_max_refl / low / high were the three literals
#                            of `np.where(valid_max_refl < 45.0, 37.5, 40.0)`
#                            at gatemapper.py:174.
#   max_refl_clamp           the 52.0 of `np.minimum(valid_max_refl, 52.0)` at
#                            gatemapper.py:175.
#
# Together :174-176 form the per-cell threshold curve
#   max(where(m < 45, 37.5, 40), min(m, 52) - drop_offset)
# -- an algorithm, in the same class as the `scale_rule` and `crs_strategy`
# pseudo-expressions removed elsewhere. Only `drop_offset` is a setting.

schema_version: 1

detection:
  refl_threshold: 37.5                  # main.py:29,100
  min_seed_percentage: 0.001            # main.py:30,101; see gatemapper.py:146
  drop_offset: 10.0                     # main.py:31,102
  stormcell_cleanup_max_age_minutes: 120  # main.py:105
  # main.py:358,366. Used when the previous scan's timestamp is missing or
  # yields a non-positive delta.
  fallback_dt_seconds: 120.0

  # main.py:333-340, applied only when --disable-tracking is passed. Named for
  # that flag, not for frame count: single-frame mode (main.py:223-274) also
  # skips tracking, but returns before these defaults are stamped, so its cells
  # carry no tracking fields at all rather than these values.
  tracking_disabled_defaults:
    tracking_mode: active
    prediction_count: 0
    event_type: active

tracker:
  # track.py:65 StormCellTracker.__init__, forwarded into LineageDetector at
  # :186. This -- not lineage.yaml's `event_overlap_ratio` -- is the value the
  # pipeline actually applies, because the tracker always passes its own.
  lineage_overlap_ratio: 0.10

gatemapper:
  # gatemapper.py:119-122. Symmetric 2-pixel pad around the reflectivity
  # bounding box; the `+ 3` on the high edges is this 2 plus one for the
  # exclusive slice end, not a different pad.
  crop_pad_px: 2

  reject_clusters_at_or_below_gates: 5  # gatemapper.py:244, after watershed
  contour_downsample: 8                 # gatemapper.py:287 draw_bbox(step=...)

  # gatemapper.py:341-346. Short contours are downsampled less so small cells
  # keep their shape; anything longer falls through to `contour_downsample`.
  contour_downsample_adaptive:
    keep_all_below_points: 8            # n_points < 8  -> step 1
    coarse_below_points: 24             # n_points < 24 -> step 4
    keep_all_step: 1
    coarse_step: 4

  # gatemapper.py:332 measure.find_contours level. Not under `morphology`:
  # morphology.py does trace contours, but with cv2.findContours (:66), which
  # takes no level argument. The hail masks use the same 0.5 through a separate
  # literal; see `hail.contour_level`.
  contour_level: 0.5
  coordinate_decimals: 3                # gatemapper.py:368-374

morphology:
  min_pixels_full_analysis: 25          # morphology.py:14 _MIN_PIXELS_FULL_ANALYSIS

  # morphology.py:97. A second, independent size gate: cells past the pixel test
  # above still skip convexity-defect analysis if their contour has fewer than
  # this many points.
  min_contour_points_for_defects: 10

# tools/alert_matcher.py, reached only from main.py:253,390.
alert_matching:
  # CONVECTIVE_FLOOD_EVENTS (alert_matcher.py:31-41). An allowlist: an NWS event
  # name absent from this set is never attached to a cell, so adding a product
  # upstream is not enough to make it appear.
  events:
    - Tornado Warning
    - Severe Thunderstorm Warning
    - Tornado Watch
    - Severe Thunderstorm Watch
    - Special Weather Statement
    - Severe Weather Statement
    - Flash Flood Warning

  # alert_matcher.py:438,468 and :441,469. Degrees of slack added to a cell
  # before testing intersection, to absorb edge rounding. Polygons get less
  # slack than point cells because a point has no footprint of its own.
  polygon_match_buffer_deg: 0.005
  point_match_buffer_deg: 0.01

hail:
  contour_sampling_step: 5              # save.py:148,230
  # save.py:169,252,423 all compare preciptype to 6. The docstring at save.py:151
  # says 7; the code is authoritative and 6 is what runs.
  preciptype_class: 6

  # save.py:174,256 measure.find_contours level on the hail mask. Same number as
  # `gatemapper.contour_level` but a separate literal with a separate owner, so
  # changing one must not silently change the other.
  contour_level: 0.5

env_overrides: {}                       # CLI only: --refl-threshold, --min-seed-percentage, --drop-offset
