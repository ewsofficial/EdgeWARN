# api.yaml — Audit §9 Node APIs
#
# Source: src/api/config/index.js:45-68; server.js:7-8; app.js:22,26,29;
#         middleware/cors.js:6-13; middleware/rateLimit.js:4-5;
#         middleware/requestId.js:3; middleware/security.js:6,10,19;
#         repositories/artifactRepository.js:14-15,17-21,28,76;
#         services/validation.js:1-4,15-16,18-19; services/ancillary.js:4-6;
#         services/analysis.js:4; services/renders.js:5-7,16-17,47,50,60,62,85;
#         config/productCatalog.js:3,10,13-14;
#         routes/v3/index.js:6-9,10,13-18,36-37;
#         src/EWMRS/api/server.js:17-18,71-80,145,245-247
# Values verified against the working tree at commit e426fb2.
# Not yet consumed by code; see plans/source-configuration-extraction-plan.md.
#
# Three keys that were here are deleted, not moved: `server.json_body_limit`,
# `server.cluster_max_workers`, and `security.hsts_max_age_seconds`. Each existed
# only in src/EdgeWARN/api/server.js (:169, :256, :73-75), whose CLI entry point
# now delegates to the unified API (server.js:282). The live service under
# src/api/ sets no HSTS header, mounts no JSON body parser, and does not cluster.
# Recording them under `server`/`security` claimed the live server honored them.

schema_version: 1

server:
  host: 0.0.0.0                         # server.js:7
  port: 5000                            # config/index.js:65, env PORT
  debug_port: 3001                      # server.js:8, --debug-server
  request_timeout_ms: 30000             # config/index.js:66; responds 503 (security.js:19)
  static_root: src/EWMRS                # app.js:26, joined to the src/ directory
  openapi_spec: openapi/v3.yaml         # app.js:22, relative to src/api/
  # app.js:29. In production the real package version is withheld and this label
  # is served instead.
  production_version_label: '2.x'

  # config/index.js:54, the `packageVersion` parameter default. Reached only when
  # createConfig is called without app.js supplying package.json's version; it
  # matches package.json:3 today, so the two must be bumped together.
  package_version_fallback: '2.7.0'

  # routes/v3/index.js:37, self-reported at GET /api/v3. Duplicated as
  # `info.version` in openapi/v3.yaml, and unrelated to the package version above.
  v3_api_version: '3.0.0'

base_dir:
  windows: 'C:\EdgeWARN_input'
  posix: ~/EdgeWARN_input
  # config/index.js:55-60. All four inputs are read and compared after
  # path.resolve; two that disagree raise 'Conflicting base directory settings'
  # rather than one silently winning.
  derived: {data: <base_dir>/data, gui: <base_dir>/gui, wpc: <base_dir>/wpc}

security:
  # DENY-ALL, in every environment. cors.js:6-9 answers `callback(null, false)`
  # for an origin absent from the set and for a missing Origin header; there is
  # no allow-all branch. The permissive fallback existed only in the retired
  # src/EdgeWARN/api/server.js:99-107, where a missing ALLOWED_ORIGINS became
  # `origin: true` -- and even there only outside production, which already
  # collapsed to []. Leaving this empty is the safe default; widen it
  # deliberately, per deployment.
  allowed_origins: []

  # config/index.js:45-52. Tri-shaped: false when unset/'false'; the integer 1
  # when 'true' (and that form THROWS under NODE_ENV=production, :48); otherwise
  # the comma-split list from TRUST_PROXY_IPS.
  trust_proxy: false

  cors:                                 # cors.js:10-13, all hardcoded
    methods: [GET, HEAD, OPTIONS]
    allowed_headers: [Content-Type, X-Request-Id]
    max_age: 600
    credentials: false

  csp_default_src: "'self'"             # middleware/security.js:6
  compression_skip_media: image/*       # security.js:10

rate_limits:
  # max = 0 disables the limiter outright (rateLimit.js:4 returns null and the
  # entry is filtered out), so 0 is not "unlimited by accident" -- it is the
  # documented off switch.
  #
  # The two window_ms values are hardcoded at rateLimit.js:5 (`build(1_000, ...)`
  # and `build(60_000, ...)`); createRateLimiters accepts only the two maxima.
  # Recorded because they are the windows that run, but a YAML edit needs the
  # call site widened first.
  per_second: {max: 40, window_ms: 1000}      # config/index.js:67, RATE_LIMIT_MAX_SEC
  per_minute: {max: 2000, window_ms: 60000}   # config/index.js:68, RATE_LIMIT_MAX_MIN
  standard_headers: true
  legacy_headers: false

artifacts:
  size_limits_bytes: {json: 8388608, binary: 134217728, image: 33554432}  # :14 DEFAULT_LIMITS
  json_cache: {max_entries: 256, max_size_bytes: 33554432}                # :28
  list_limit: 1000                      # artifactRepository.js:76

  # renders.js:85. A decoded chunk may exceed rows*cols*channels*bytes by up to
  # this much before it is rejected as INVALID_ARTIFACT; it absorbs gzip framing
  # rather than allowing a genuinely larger payload.
  chunk_length_slack_bytes: 1024

pagination:
  default_limit: 100                    # validation.js:18; :19 repeats it as the invalid-input fallback
  max_limit: 1000                       # :19, Math.min(limit, 1000)

cache_control_max_age:
  collection: 5                         # routes/v3/index.js:6
  resource: 60                          # :7-8
  asset: 31536000                       # :9, sent with `immutable`

query:
  # routes/v3/index.js:14, and only on the collection paths enumerated at :10 and
  # matched at :13. Every OTHER v3 path allows no query parameter at all -- the
  # allowlist is literally empty there, so this is not a global permission.
  # :15 adds `source` on the alert paths.
  #
  # validateQuery is mounted on the v3 router only (:36), so the /api/v2
  # compatibility routes are not filtered by any of this.
  allowed_params: [cursor, limit]
  max_value_length: 256                 # :17
  limit_pattern: '^(?:[1-9][0-9]{0,2}|1000)$'   # :18

render_defaults:
  grid: {rows: 10, cols: 20, tile_size: 350}    # renders.js:5

  # renders.js:7, applied to the `tile_grid` read from an artifact's index.json --
  # never to anything a caller supplies. Out-of-range is DISCARDED, not fatal:
  # grid() returns null and the product and tile paths fall back to the defaults
  # above (:47, :50, :60, :62). Only a chunk index rejects it outright (:16-17).
  grid_maxima: {rows: 100, cols: 100, tile_size: 4096}

validation:
  # DESCRIPTIVE ONLY. The enforced form is /^\d{8}-\d{6}$/ (validation.js:1),
  # followed by a UTC round-trip check that rejects impossible calendar dates.
  timestamp_format: 'YYYYMMDD-HHMMSS'

  alert_sources: [official, edgewarn]           # services/analysis.js:4
  cell_id_pattern: '^[1-9][0-9]*$'              # validation.js:2, no leading zero
  # validation.js:3-4, each with one extra exclusion the pattern cannot express:
  # the alert id also rejects __proto__/constructor/prototype (:15), and the
  # layer id also rejects any '..' (:16). The two exclusions are different -- one
  # is not applied to both.
  alert_id_pattern: '^[A-Za-z0-9_.:-]{1,200}$'
  layer_id_pattern: '^[A-Za-z0-9_.-]{1,128}$'

  # middleware/requestId.js:3. An inbound X-Request-Id matching this is echoed;
  # anything else is replaced by a generated UUID, so a malformed header is never
  # an error.
  request_id_pattern: '^[A-Za-z0-9_-]{8,128}$'
  radar_site_pattern: '^[A-Z0-9]{4}$'           # ancillary.js:4
  elevation_pattern: '^\d{1,3}(?:\.\d{1,2})?$'  # ancillary.js:5

  # ancillary.js:6 RADAR_PRODUCTS. An allowlist -- a product absent from this set
  # is rejected before any file lookup, so the recorded names matter, not just
  # the count. CCORH is present here but absent from ewmrs_render.yaml
  # `nexrad_gui.variable_colormaps`, which colors only the other six, so the API
  # accepts one product the renderer never draws.
  radar_products: [DBZH, VRADH, WRADH, PHIDP, CCORH, RHOHV, ZDR]

  # artifactRepository.js:15 SAFE_SEGMENT, applied to every path segment
  # (assertSegments, :17-21). `.` and `..` are rejected separately at :18, since
  # the pattern alone would admit both.
  safe_path_segment_pattern: '^[A-Za-z0-9_.-]+$'

product_catalog:
  file: src/api/config/product-catalog.json
  entries: 31
  # `colormapId` is present on only 21 of the 31 entries; the other five fields
  # are on all 31. Do not treat it as required.
  #
  # These are the PRESENCE counts, which are stricter than what the loader
  # enforces: productCatalog.js:10 requires only id/legacyId/storageDirectory/
  # legacyFilePrefix. `representation` is universally present but unvalidated, so
  # dropping it from an entry would pass the code and break this contract.
  required_fields: [id, legacyId, storageDirectory, legacyFilePrefix, representation]
  optional_fields: [colormapId]

  # productCatalog.js:3 SLUG, enforced on `id` at :10. `legacyId` and
  # `storageDirectory` have no shape rule, only the uniqueness check at :13-14.
  id_pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'

# RETIRED MODULE. src/EWMRS/api/server.js still exports createApp/startServer and
# these literals are live inside it, but its CLI entry point delegates to the
# unified API (:245-247) and no npm script targets it -- `api:ewmrs` runs
# `src/api/server.js --compat=ewmrs`. Nothing reaches port 3003 in normal
# operation; editing this block changes nothing unless a caller imports
# startServer directly.
legacy_ewmrs:
  port: 3003                            # :17
  debug_port: 3004                      # :18
  # :76,:78 hardcode the windows; only the maxima are configurable, via
  # --ewmrs-rate-limit-1s/-1m or the env vars below (:77,:79).
  rate_limits: {per_second: 30, per_minute: 1800, window_ms: [1000, 60000]}
  list_files_limit: 50                  # :145, excludes .idx

env_overrides:
  server.port: PORT
  server.request_timeout_ms: REQUEST_TIMEOUT_MS
  rate_limits.per_second.max: RATE_LIMIT_MAX_SEC
  rate_limits.per_minute.max: RATE_LIMIT_MAX_MIN
  legacy_ewmrs.rate_limits.per_second: EWMRS_RATE_LIMIT_MAX_SEC
  legacy_ewmrs.rate_limits.per_minute: EWMRS_RATE_LIMIT_MAX_MIN
  security.allowed_origins: ALLOWED_ORIGINS
  security.trust_proxy: ['TRUST_PROXY_IPS', 'TRUST_PROXY']
  base_dir: ['EDGEWARN_BASE_DIR', 'BASE_DIR']
  # config/index.js:62-64, --config-dir. The only row here with no counterpart
  # key in this document, and necessarily so: it selects the directory these YAML
  # files are read FROM, so it can never be set from inside one. Listed to
  # document the variable, not to imply a settable key.
  #
  # On the Python side, io.py also *writes* this variable so that accessory
  # processes -- spawned without argv -- inherit the parent's --config-dir
  # choice instead of re-resolving to the repo-default config/.
  config_dir: ['EDGEWARN_CONFIG_DIR']
  # RATE_LIMIT_WINDOW_MS_SEC / RATE_LIMIT_WINDOW_MS_MIN are deliberately absent:
  # they are read only by the retired src/EdgeWARN/api/server.js:55,57. Setting
  # either against the live service does nothing.
  #
  # NODE_ENV drives isProduction; PROJ_DATA/PROJ_LIB/GDAL_DATA are set by
  # EWMRS/render/tools.py for child processes and are not config keys.
