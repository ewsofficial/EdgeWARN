# Storm-cell integration catalog. Names, keys, and field mappings are output contracts.

schema_version: 1

# Serialized integration output settings.
output:
  # Output precision; change only if all API consumers tolerate the new representation.
  decimals: 2

# Lightning binning; changing resolution affects all derived GLM statistics.
glm:
  bin_size_degrees: 1.0

# Statistic catalog. Keep keys stable because they are stored in storm-cell outputs.
stats_datasets:
  - {name: Ref0,            filepath: MRMS_REF_0C_DIR,    key: Ref0,               method: max}
  - {name: Ref5,            filepath: MRMS_REFM5C_DIR,    key: Ref5,               method: max}
  - {name: Ref15,           filepath: MRMS_REFM15C_DIR,   key: Ref15,              method: max}
  - {name: NLDN,            filepath: MRMS_NLDN_DIR,      key: maxCGFlashDensity,  method: max}
  - {name: EchoTop18,       filepath: MRMS_ECHOTOP18_DIR, key: maxEchoTop18,       method: max}
  - {name: EchoTop18 (95th),filepath: MRMS_ECHOTOP18_DIR, key: p95EchoTop18,       method: percentile, percentile: 95}
  - {name: EchoTop18 (90th),filepath: MRMS_ECHOTOP18_DIR, key: p90EchoTop18,       method: percentile, percentile: 90}
  - {name: EchoTop30,       filepath: MRMS_ECHOTOP30_DIR, key: maxEchoTop30,       method: max}
  - {name: EchoTop30 (90th),filepath: MRMS_ECHOTOP30_DIR, key: p90EchoTop30,       method: percentile, percentile: 90}
  - {name: EchoTop50 (90th),filepath: MRMS_ECHOTOP50_DIR, key: p90EchoTop50,       method: percentile, percentile: 90}
  - {name: VIL,             filepath: MRMS_VIL_DIR,       key: maxVIL,             method: max}
  - {name: VIL (95th),      filepath: MRMS_VIL_DIR,       key: p95VIL,             method: percentile, percentile: 95}
  - {name: VIL (90th),      filepath: MRMS_VIL_DIR,       key: p90VIL,             method: percentile, percentile: 90}
  - {name: VIL (50th),      filepath: MRMS_VIL_DIR,       key: p50VIL,             method: percentile, percentile: 50}
  - {name: VIL Density,     filepath: MRMS_DVIL_DIR,      key: maxVILDensity,      method: max}
  - {name: VIL Density (95th), filepath: MRMS_DVIL_DIR,   key: p95VILDensity,      method: percentile, percentile: 95}
  - {name: VIL Density (90th), filepath: MRMS_DVIL_DIR,   key: p90VILDensity,      method: percentile, percentile: 90}
  - {name: VIL Density (50th), filepath: MRMS_DVIL_DIR,   key: p50VILDensity,      method: percentile, percentile: 50}
  - {name: AzShear Low,     filepath: MRMS_AZSHEARLOW_DIR, key: maxAzShearLow,     method: max}
  - {name: AzShear Low (95th), filepath: MRMS_AZSHEARLOW_DIR, key: p95AzShearLow,  method: percentile, percentile: 95}
  - {name: AzShear Mid,     filepath: MRMS_AZSHEARMID_DIR, key: maxAzShearMid,     method: max}
  - {name: AzShear Mid (95th), filepath: MRMS_AZSHEARMID_DIR, key: p95AzShearMid,  method: percentile, percentile: 95}
  - {name: PrecipRate,      filepath: MRMS_PRECIPRATE_DIR, key: maxPrecipRate,     method: max}
  - {name: Reflectivity at Lowest Altitude, filepath: MRMS_RALA_DIR, key: maxRALA, method: max}
  - {name: VII,             filepath: MRMS_VII_DIR,       key: maxVII,             method: max}

# Upstream-to-output field mapping. Preserve output keys for compatibility.
probsevere_field_map:
  ProbSevere: ProbSevere
  ProbWind: ProbWind
  ProbHail: ProbHail
  ProbTor: ProbTor
  MLCAPE: MLCAPE
  MUCAPE: MUCAPE
  MLCIN: MLCIN
  DCAPE: DCAPE
  CAPE_M10M30: CAPE_M10M30
  LCL: LCL
  Wetbulb_0C_Hgt: WETBULB_0C_HGT
  LLLR: LLLR
  MLLR: MLLR
  EBShear: EBSHEAR
  SRH01km: SRH01KM
  SRH02km: SRW02KM
  SRW46km: SRW46KM
  MeanWind_1-3kmAGL: MEANWIND_1-3kmAGL
  LJA: LJA
  CompRef: COMPREF
  Ref10: REF10
  Ref20: REF20
  MESH: MESH
  H50_Above_0C: H50_Above_0C
  EchoTop50: EchoTop_50
  VIL: VIL
  MaxFED: MaxFED
  MaxFCD: MaxFCD
  AccumFCD: AccumFCD
  MinFlashArea: MinFlashArea
  TE@MaxFCD: TE@MaxFCD
  FlashRate: FLASH_RATE
  FlashDensity: FLASH_DENSITY
  MaxLLAz: MAXLLAZ
  p98LLAz: P98LLAZ
  p98MLAz: P98MLAZ
  MaxRC_Emiss: MAXRC_EMISS
  ICP: ICP
  PWAT: PWAT
  avg_beam_hgt: AVG_BEAM_HGT

# RAP field catalog. Filters and aliases accommodate GRIB naming variants.
rap_products:
  # Supported pressure levels; retain ordered, standard levels for vertical products.
  isobaric_levels_mb: &isobaric_levels_mb
    [1000, 975, 950, 925, 900, 875, 850, 825, 800, 775, 750,
     725, 700, 675, 650, 625, 600, 575, 550, 525, 500, 475,
      450, 425, 400, 375, 350, 325, 300, 275, 250, 225, 200,
      175, 150, 125, 100]

  products:
    - {var: u,   var_aliases: [u, UGRD, u-component_of_wind_isobaric, wind_u], filter: {typeOfLevel: isobaricInhPa}, levels: *isobaric_levels_mb, key_template: 'wind_field.u{level}'}
    - {var: v,   var_aliases: [v, VGRD, v-component_of_wind_isobaric, wind_v], filter: {typeOfLevel: isobaricInhPa}, levels: *isobaric_levels_mb, key_template: 'wind_field.v{level}'}
    - {var: u10, var_aliases: [u10, 10u, u],   filter: {typeOfLevel: heightAboveGround, level: 10}, key: u10m}
    - {var: v10, var_aliases: [v10, 10v, v],   filter: {typeOfLevel: heightAboveGround, level: 10}, key: v10m}
    - {var: t2m, var_aliases: [t2m, 2t, t],    filter: {typeOfLevel: heightAboveGround, level: 2}, key: temp_2m,     transform: kelvin_to_celsius}
    - {var: d2m, var_aliases: [d2m, 2d, dpt],  filter: {typeOfLevel: heightAboveGround, level: 2}, key: dewpoint_2m, transform: kelvin_to_celsius}
    - {var: gh,  filter: {typeOfLevel: isothermZero}, key: freezing_level_m}

  # Derived formulas reference keys defined by the product catalog above.
  derived:
    - {key: dewpoint_depression,   formula: 'temp_2m - dewpoint_2m'}
    - {key: freezing_level_height, formula: 'freezing_level_m / 1000'}
