# ewmrs_pipeline.yaml — Audit §8 EWMRS pipeline
#
# Source: src/EWMRS/pipeline.py:57-65,118-150,343,598,679-680,731,750,794;
#         src/EWMRS/render/render.py:23,99-108
# Values verified against the working tree at commit e426fb2.
# Owns every EWMRS concurrency, cache, and retention knob; the layer catalogs
# live in ewmrs_render.yaml. Not yet consumed by code; see
# plans/source-configuration-extraction-plan.md.
#
# GOES_WEB_MERCATOR_BOUNDS is deliberately absent: pipeline.py:44-55 derives the
# grid shape and affine transform from it, so a YAML copy would be a second
# editable source that can silently disagree with the projection code.

schema_version: 1

render:
  max_entries: 10                         # pipeline.py:677
  cleanup_after: true                     # pipeline.py:680
  phase_name: EWMRS                       # pipeline.py:679
  goes_cleanup_max_age_minutes: 120       # pipeline.py:750; also hardcoded at :794
  goes_cleanup_min_interval_seconds: 300  # pipeline.py:57
  gui_cleanup_max_age_minutes: 120        # pipeline.py:598; also hardcoded at :343,:731

nexrad_gui:
  retention_minutes: 120                  # pipeline.py:60
  poll_interval_seconds: 30.0             # pipeline.py:64
  poll_interval_min_seconds: 1.0          # pipeline.py:585 floor
  max_workers: 8                          # pipeline.py:65; effective min(8, len(pending))

workers:
  # pipeline.py:128-150. The CPU/memory arithmetic stays in code; only the
  # budgets, the reserve, and the no-psutil ceiling are tunable.
  strategy: adaptive_memory
  budget_mb:
    goes: 1200.0                          # phase name starting with "GOES"
    default: 768.0                        # MRMS and everything else
  reserve_mb: 1024.0
  psutil_fallback_max: 2                  # pipeline.py:150 when psutil is unavailable
  # pipeline.py:118-125 sets one shared value across a fixed variable list; the
  # code cannot express per-variable caps, so do not split this into a map.
  numeric_thread_caps:
    value: 1
    variables: [OMP_NUM_THREADS, MKL_NUM_THREADS, OPENBLAS_NUM_THREADS, NUMEXPR_NUM_THREADS]

render_threads:
  max_tile_threads: 8                     # render/render.py:108; effective min(tile_count, 8, cpu_count)

caches:
  tile_index_entries: 512                 # pipeline.py:68 lru_cache
  colormap_entries: 128                   # render/render.py:23 lru_cache

env_overrides:
  render.goes_cleanup_min_interval_seconds: EWMRS_GOES_CLEANUP_MIN_INTERVAL_SECONDS
  workers.budget_mb: EWMRS_WORKER_BUDGET_MB
  workers.reserve_mb: EWMRS_WORKER_RESERVE_MB
  render_threads.max_tile_threads: EWMRS_TILE_THREADS
