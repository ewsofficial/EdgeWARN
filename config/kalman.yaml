# Tracking defaults calibrated for normal scan cadence. Tune coupled values only with replay validation.

schema_version: 1

# Filter-noise settings are coupled to observed position uncertainty.
kalman_filter:
  process_noise:
    acceleration: 0.1

  measurement_noise:
    position: 0.5

# Lifecycle thresholds; lower confidence limits retain weaker tracks.
tracking:
  max_prediction_time_minutes: 6.0

  confidence_threshold: 0.4

  confidence_decay_factor: 0.7

# Matching gates and costs; tune as a set to avoid unstable associations.
assignment:
  # Initial candidate radius; too small loses fast cells, too large raises false matches.
  prefilter_radius_km: 16.0

  gating_threshold: 6.0

  min_gating_radius_km: 2.0

  weights:
    position: 1.0

    velocity_direction: 2.0

    size_similarity: 0.5

  # Greedy is the supported production assignment mode.
  method: greedy


# Numerical-stability settings; do not change without Kalman-filter expertise.
filter_internals:
  initial_position_uncertainty_km: 1.0
  innovation_covariance_regularization: 1.0e-6
  singular_retry_regularization: 1.0e-4
  initial_velocity_variance: 100.0
  initial_acceleration_variance: 1.0

# Confidence shaping values; all terms jointly determine decay behavior.
confidence:
  time_penalty_weight: 0.3
  motion_factor_variance_denominator: 2500.0
  factor_floor: 0.8
  position_decay_onset_std: 5.0
  position_decay_scale: 30.0

# Cost normalization constants; change only with assignment regression tests.
assignment_costs:
  default_dt_seconds: 120.0
  predicted_speed_deadband_ms: 1.0
  implied_speed_deadband_ms: 0.5
  reflectivity_diff_cap: 1.0
  size_ratio_log2_divisor: 2.0
  size_cost_cap: 1.0
