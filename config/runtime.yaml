# runtime.yaml — Audit §1 (src/util/io.py shared parser), §2 env vars, §7 scheduler
#
# Source: src/run.py:48-58,118-120,136-152,171-182,195,222-224,356-357;
#         src/util/io.py:86-87,113-114,132-144;
#         src/util/runtime/config.py; src/util/runtime/processes.py:16-30,78-81,99;
#         src/util/runtime/background.py:77-103,204-239,255-285;
#         src/util/runtime/goes.py:54-107; src/util/runtime/cycle.py:128-137,350,478,610,644;
#         src/util/performance.py:12-32,77-87; src/EdgeWARN/pipeline.py:230,376;
#         src/common/pipeline/goes_readiness.py:18-19,127;
#         src/common/pipeline/coordinator.py:125
#
# Every key below is read by the source it names. Children spawned by the
# supervisor receive no argv, so they re-read this file through
# util/runtime/config.py using the EDGEWARN_CONFIG_DIR that io.py exports.
#
# Ten keys are deliberately absent from `run`: `profile`, `mrms_core_only`, and
# the eight `disable.*` toggles. Every one is an argparse `action="store_true"`
# flag (io.py:88-91, 108-120), so argparse fixes the value to False before any
# YAML could be consulted -- writing `true` here could never take effect. The
# flags themselves are real; only a YAML default for them is unreachable.
#
# --mrms-core-only fans out further than the old comment here claimed: it forces
# EWMRS, NWS, METAR, GOES and NEXRAD off (run.py:59-64), WPC off (:195), and RAP
# ingest off (cycle.py:480) -- seven subsystems, not three.
#
# `env_overrides.run.base_dir` is also gone. Python reads no environment variable
# for the base directory at all -- util/file.py chooses by platform.system() at
# import time and accepts an override only through initialize_filesystem(). The
# EDGEWARN_BASE_DIR/BASE_DIR pair is Node-only; see filesystem.yaml.

schema_version: 1

# Outbound HTTP identity, shared by every subsystem that calls a public API:
# NWS zone sync (zone_sync.py:165), the NWS alert feed sync and async
# (nws/main.py:106,170), the NEXRAD radar-station catalog (nexrad/weather_api.py:73)
# and the METAR fetch (metar.py:98). Those five sites used to carry three
# different hardcoded strings.
#
# `{version}` is filled from package.json at call time by
# util/release.py format_user_agent(), so the advertised version cannot drift
# from the release the way a copied literal did.
#
# api.weather.gov asks callers to identify themselves with a reachable contact
# address, and the parenthesized `(app, contact)` shape is the form its
# documentation shows. Both placeholders are pinned by the schema pattern, which
# also forbids CR/LF, so this string cannot be used to inject a second header.
identity:
  user_agent_template: '(EdgeWARN/{version}, {contact})'
  contact: ewsbackend@gmail.com

run:
  # io.py:113-114,132-133. The CLI flags default to None so these values win
  # unless --lat_limits/--lon_limits is passed.
  lat_limits: [20, 55]
  # io.py:144 rewrites this to `lon % 360` after the overlay, so a negative
  # western longitude here becomes its 0-360 equivalent. Recorded pre-normalized.
  lon_limits: [230, 300]

goes_coordination:
  poll_seconds: 60                      # run.py:49 -> background.py:81
  render_wait_seconds: 30               # run.py:50
  render_wait_interval_seconds: 1.0     # run.py:51
  render_max_offset_minutes: 20.0       # goes_readiness.py:18-19,127
  # run.py:54-58. Read through common/config/overlay.py, so the truthy set is
  # {1, true, yes, on} tested AFTER strip().lower(): "True " and " YES" read
  # true, and anything outside the set ("2", "enabled") reads false.
  pause_ingest_during_render: false

  # background.py:85-87. While a render holds the pause, the ingest loop wakes
  # every 0.2 s inside a 1 s window rather than sleeping the full poll interval.
  render_pause_poll_seconds: 1.0
  render_pause_poll_interval_seconds: 0.2
  # background.py:103, the interval the 60 s poll is subdivided into so shutdown
  # is observed promptly.
  poll_interval_seconds: 1.0

  # goes.py:57,90. A floor, not a period: it clamps the caller's requested
  # interval (`render_wait_interval_seconds` above) so a zero or negative
  # override cannot spin the readiness wait.
  render_wait_interval_floor_seconds: 0.1
  # goes.py:71,107, the subdivision of each readiness-wait sleep.
  render_wait_poll_granularity_seconds: 0.2

  # cycle.py:610, the second element of the render task tuple; background.py:136
  # unpacks it as `dt, max_entries = latest_task[:2]`.
  render_task_max_entries: 10

# processes.py AccessorySupervisor. A dead child is restarted with exponential
# backoff; more than max_restarts deaths inside restart_window_seconds disables
# restarts for that child rather than looping forever.
supervisor:
  # run.py:356-357, the shutdown-watch loop -- 30 ticks of 0.5 s, so the
  # scheduler notices a dead accessory within 15 s. These two are consumed in
  # run.py, not processes.py.
  check_ticks: 30
  tick_seconds: 0.5
  max_restarts: 5                       # processes.py:78, and run.py:176
  restart_window_seconds: 60.0          # :79, run.py:177
  base_backoff_seconds: 1.0             # :80, run.py:178
  max_backoff_seconds: 30.0             # :81, run.py:179

  # processes.py:16-30 stop_process. terminate() is given join_timeout seconds;
  # a child still alive after that is kill()ed and joined for one more second.
  stop_join_timeout_seconds: 5
  stop_kill_join_timeout_seconds: 1

  # There is deliberately no `heartbeat_startup_grace_seconds` here. The grace
  # is only consulted for a child that also has a heartbeat_path
  # (processes.py:99, _stale_heartbeat_age returns early without one), and the
  # sole such child -- NEXRAD Ingest -- supplies its own from nexrad.yaml at
  # run.py:225. A value here could never reach a consumer.

  # DATA_DIR-relative artifacts the supervisor writes. Named by filesystem
  # attribute, resolved with getattr(util.file, dir) at call time so a base
  # directory rebound by initialize_filesystem() is honored.
  health_file: {dir: DATA_DIR, name: runtime/accessory_health.json}      # run.py:180-182
  nexrad_heartbeat_file: {dir: DATA_DIR, name: runtime/nexrad_ingest_heartbeat.json}  # run.py:172-173

# background.py accessory loop cadences. `sleep_until_boundary(n)` waits for the
# next n-minute wall-clock boundary; `sleep_for(n, ...)` waits n seconds.
background_intervals:
  metar_boundary_minutes: 5             # background.py:255
  nws_seconds: 120                      # :276
  nws_interval_seconds: 1.0             # :276, the subdivision of that 120 s
  wpc_boundary_minutes: 15              # :283
  # :205,238. A restart delay, not a cadence: the NEXRAD pipeline is expected to
  # run continuously, and this is how long the loop waits before relaunching it.
  nexrad_seconds: 5
  nexrad_interval_seconds: 0.2          # :239, the subdivision of that 5 s

cycle:
  # run.py:118-120. Named by filesystem attribute so it follows a relocated base dir.
  state_file: {dir: DATA_DIR, name: runtime/cycle_state.json}

  retry:                                # cycle.py:128-137 CycleRetryPolicy
    max_attempts: 3
    # run.py:136-152 clamps both with max(0.0, ...), so 0 is legal and means
    # "retry immediately" -- these are not exclusive-positive bounds.
    initial_backoff_seconds: 5.0
    max_backoff_seconds: 30.0

  # cycle.py:478 -> coordinator.py:125. The S3 listing depth for MRMS detection
  # and MRMS integration ingest. GOES passes its own count, so this governs the
  # MRMS pair only.
  ingest_max_entries: 10

  # cycle.py:644. How often the tandem cycle drains its log queues while waiting
  # on the worker processes.
  log_drain_poll_seconds: 1

profiling:
  # TRI-STATE, not a boolean. performance.py:23 declares `_ENABLED: bool | None`
  # and null here means "no opinion": _resolve_enabled (:22-32) consults
  # EDGEWARN_PERF_TRACKER first and falls back to this value, so writing `false`
  # would pin profiling off for anyone who has not set the variable. Either way
  # the deferral ends once TimingTracker.set_enabled (:77-87) pins the global,
  # which `--profile` does at EdgeWARN/pipeline.py:230,376.
  perf_tracker: null

env_overrides:
  # io.py:87, --config-dir. The only row here with no counterpart key in this
  # document, and necessarily so: it selects the directory these YAML files are
  # read FROM, so it can never be set from inside one.
  #
  # Also the only row io.py *writes*: both arg parsers export the resolved root
  # back into the environment, because accessory processes are spawned without
  # argv and would otherwise re-resolve to the repo-default config/.
  config_dir: ['EDGEWARN_CONFIG_DIR']
  goes_coordination.pause_ingest_during_render: EDGEWARN_PAUSE_GOES_INGEST_DURING_RENDER
  cycle.retry.max_attempts: EDGEWARN_CYCLE_MAX_ATTEMPTS
  cycle.retry.initial_backoff_seconds: EDGEWARN_CYCLE_RETRY_BACKOFF_SECONDS
  cycle.retry.max_backoff_seconds: EDGEWARN_CYCLE_MAX_BACKOFF_SECONDS
  profiling.perf_tracker: EDGEWARN_PERF_TRACKER
