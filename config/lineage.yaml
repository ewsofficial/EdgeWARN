# Lineage defaults. Overlap and buffering settings affect split/merge continuity.

schema_version: 1

lineage:
  # Minimum overlap for continued lineage; tune only with split/merge test cases.
  tracked_overlap_ratio: 0.10

  # Keep zero unless geographic rounding demonstrably rejects valid overlaps.
  bounds_prefilter_buffer_deg: 0.0

  # Confirmation buffering limits false split/merge events and bounds pending memory.
  buffer:
    min_confirmations: 2
    max_pending: 100
    prune_after_scans: 5
    scan_interval_seconds: 120.0
