zone_sync:
  assets_dir: assets/nws_zones
  zone_types: [forecast, fire, public, county, marine]
  timeout_seconds: 30
  max_retries: 3
  max_workers: 16
  pause_seconds: 0.0
  progress: true                        # --no-progress disables
  apply: false                          # default is dry-run
  report_path: null
