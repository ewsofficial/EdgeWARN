# nws.yaml — Audit §1 zone_sync CLI, §7 NWS
#
# Read through src/common/ingest/nws/config.py, whose accessors are per-call --
# `src/run.py` imports this package before get_args() publishes the config root,
# so a value bound at module scope would freeze the repo default.
#
# Source: main.py:50,61,125,214,225; registry.py:89,235-253,569;
#         zone_sync.py:22,58,89,150-155,166,189,231,240,369-429;
#         geomapper.py:28,80,85,110,183,318,368
#
# The `nws` block is fully wired. `geomapper` is not wired at all, and
# `zone_sync` is wired in part: _resolve_zone_sync_args (zone_sync.py:432-449)
# reads seven of its thirteen keys -- assets_dir, zone_types, timeout_seconds,
# max_retries, max_workers, pause_seconds, progress -- and overlays the CLI on
# top of each. The remaining eight keys across the two blocks are marked UNUSED
# at their definitions; see plans/source-configuration-extraction-plan.md.
#
# `assets_dir` is the one key here with a second consumer: geomapper.py reads it
# back to look polygons up. See its comment below.
#
# `zone_sync.apply` and `zone_sync.report_path` are deliberately absent, and no
# UNUSED marker would fit them because there is nothing to mark: `--apply` is
# `action="store_true"` (zone_sync.py:413-417) so argparse fixes its False before
# any YAML could be consulted, and `--report-path` (:418-422) has no default at
# all. A key for either could never be reached.

schema_version: 1

nws:
  # This used to be three literal 2.0s -- passed explicitly by main.py's
  # _get_registry, and again as the signature default of both AlertRegistry and
  # get_registry. They agreed, so the split was invisible; raising the retention
  # window meant finding all three. The two signatures now default to None and
  # resolve here, which also means a test constructing a registry without a TTL
  # gets the operator's value rather than a second one.
  registry_ttl_hours: 2.0

  # Discarded on ingest, so nothing downstream can recover an event named here.
  # 19 entries: the source set literally repeated five of them, which Python
  # silently collapsed, and the duplicates are not reproduced here.
  dropped_events:
    - Administrative Message
    - Freezing Spray Advisory
    - Low Water Advisory
    - High Surf Advisory
    - Small Craft Advisory
    - Brisk Wind Advisory
    - Practice/Demo Warning
    - Required Weekly Test
    - Required Monthly Test
    - Test Message
    - Hurricane Local Statement
    - Flood Statement
    - Flash Flood Statement
    - Rip Current Statement
    - Lakeshore Flood Statement
    - Hydrologic Outlook
    - Air Quality Alert
    - Air Stagnation Advisory
    - Beach Hazards Statement

  # Was the same literal twice, in the sync and async downloads.
  active_alerts_url: https://api.weather.gov/alerts/active

  # registry.py _derive_snapshot_alert_name. Only `event` is rescored, by scanning
  # the alert description. Order here is priority order -- the first match wins,
  # so a description carrying both phrases reads as a Tornado Emergency. Every
  # other event keeps its own name.
  #
  # `description_contains` is matched against the UPPERCASED description, so a
  # lowercase phrase here can never match. The schema pattern enforces that.
  tornado_upgrade:
    event: Tornado Warning
    rules:
      - {description_contains: TORNADO EMERGENCY,               name: Tornado Emergency}
      - {description_contains: PARTICULARLY DANGEROUS SITUATION, name: PDS Tornado Warning}

geomapper:
  # UNUSED. One value, declared four times as a keyword default -- geomapper.py:80
  # round_coords, :85 _normalize_ring, :110 _geometry_to_polygon_rings, :183
  # round_geojson_coords -- and no caller overrides any of them, so editing the
  # behaviour today means editing all four signatures.
  #
  # Deliberately NOT the same key as `zone_sync.geometry_precision` below, which
  # is 5. This one is a fixed precision applied when an alert polygon is built;
  # that one is a floor that escalates. Collapsing them would silently give the
  # escalation a different starting digit.
  geometry_precision: 4

  # UNUSED. geomapper.py:28, stripped at :318 and :368. Removed from every alert's
  # properties before it reaches disk, so anything listed here is unrecoverable
  # downstream -- the same one-way filter as `nws.dropped_events`, at field
  # granularity instead of event granularity.
  junk_keys:
    - references
    - sender
    - parameters
    - instruction
    - response
    - scope
    - code
    - language
    - web
    - eventCode

zone_sync:
  # Resolved against the config root's parent, which is the repo root only for an
  # unrelocated tree. Read by BOTH ends of the zone pipeline -- zone_sync.py:441
  # writes polygons here, geomapper.py:_assets_dir reads them back -- so despite
  # living under `zone_sync` this key is not private to that CLI. The reader used
  # to find the directory by walking up from its own __file__ instead, which
  # agreed with the writer until either end was pointed elsewhere; a disagreement
  # dropped alert polygons without an error.
  assets_dir: assets/nws_zones
  zone_types: [forecast, fire, public, county, marine]  # zone_sync.py:22
  timeout_seconds: 30                   # zone_sync.py:151, --timeout-seconds type=int
  max_retries: 3                        # zone_sync.py:152
  max_workers: 16                       # zone_sync.py:153

  # UNUSED. zone_sync.py:189 `time.sleep(0.25 * attempt)`. Linear, not exponential,
  # and multiplied by the 1-based attempt number, so three retries wait 0.25 s then
  # 0.5 s. Unlike runtime.yaml's supervisor backoff there is no ceiling.
  retry_backoff_seconds: 0.25

  # UNUSED (both). zone_sync.py:58 geometry_to_rings. A FLOOR, not a fixed
  # precision: zone_sync.py:89 is `range(precision, 8)`, so a ring that degenerates
  # at 5 decimals is retried at 6 and 7 before being given up on. Raising the floor
  # narrows that escalation window; the ceiling is exclusive. The 8 is the literal
  # in that `range`, so wiring the floor without the ceiling would leave half the
  # window owned by the source.
  geometry_precision: 5
  geometry_precision_max: 8

  # Per-request throttle against api.weather.gov, applied in the worker
  # (zone_sync.py:253) before each zone-detail fetch and scaled by max_workers so
  # this stays a whole-job rate: 0.05 is ~20 requests/second however many threads
  # run. A full rebuild is ~8,600 codes, so ~7 minutes.
  #
  # This file used to record 0.0, which matched what ran but disabled throttling
  # entirely; the pause was also in the collection loop, downstream of every
  # submitted future, where it could not slow the API down at all. 0.05 is the
  # constructor's long-standing intent (zone_sync.py:154) and is now the one value.
  pause_seconds: 0.05

  progress: true                        # --no-progress disables

  # The User-Agent is NOT here. It is one string for the whole application,
  # `runtime.yaml identity`, built from package.json by
  # util/release.py format_user_agent() and applied at zone_sync.py:166 and
  # nws/main.py:77,141. This subsystem used to carry its own copy, which
  # advertised EdgeWARN/1.0 and a different mailbox than the NEXRAD ingest did.
  #
  # UNUSED, and mis-scoped besides: the same `application/geo+json` literal is
  # sent from four places -- zone_sync.py:167, main.py:78 and :142, and
  # nexrad/weather_api.py:103 -- so a key nested under `zone_sync` can only own
  # one of them. Wiring this needs a home shared with the alerts fetches, the way
  # the User-Agent above already has one.
  accept: application/geo+json

  # UNUSED (both). zone_sync.py:231 and :240. The catalog listing and the per-zone
  # detail fetch.
  zone_catalog_url_pattern: 'https://api.weather.gov/zones/{zone_type}'
  zone_detail_url_pattern: 'https://api.weather.gov/zones/{zone_type}/{code}'
