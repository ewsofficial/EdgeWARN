# mrms_goes.yaml — Audit §7 MRMS & GOES
#
# Source: src/common/ingest/mrms/{config,parse,downloader,https_client,main}.py
# Values verified against the working tree at commit e426fb2.
# `products` / `check_products` are consumed by config.py; the remaining keys are
# not yet wired -- see plans/source-configuration-extraction-plan.md.

schema_version: 1

mrms:
  # Read per call via config.py mrms_bucket(). It used to be a module-scope
  # constant, and src/run.py:9 imports this module 23 lines before get_args()
  # exports EDGEWARN_CONFIG_DIR -- so --config-dir could not reach it and an
  # operator override was silently ignored in favour of the value below.
  bucket: noaa-mrms-pds
  decompress_chunk_size_bytes: 1048576    # 1 MiB
  download_max_entries: 10                # main.py:44 max_entries default
  remove_old_files: true                  # main.py:44
  cleanup_max_age_minutes: 60             # main.py:57,78,103,125
  cadence_minutes: 2                      # timestamp_utils.py:30 (current_minute % 2)
  rounding_half_up_seconds: 30            # timestamp_utils.py:32,39 (ts.second >= 30)

  # Staged-file timestamp grammar shared by GOES coordination and EWMRS render.
  # Source: common/pipeline/goes_readiness.py:82, EWMRS/render/tools.py:62.
  staged_filename_pattern: 'MRMS_MergedReflectivityQC_(\d{8})-(\d{6})'

  # S3 key prefixes. Transcribed from parse.py:21,25 -- the modifier segment is
  # omitted entirely when a product has no modifier (ProbSevere).
  path_patterns:
    s3_prefix: '{region}/{modifier}/{YYYYMMDD}/'          # parse.py:25
    s3_prefix_no_modifier: '{region}/{YYYYMMDD}/'         # parse.py:21
    filename_prefix: 'MRMS_{modifier}_{YYYYMMDD}-{HH}'    # downloader.py:274,442
    # ProbSevere uses an underscore before the hour, not a hyphen, and is used as
    # an S3 StartAfter marker one hour behind the target time.
    probsevere_start_after: 'MRMS_PROBSEVERE_{YYYYMMDD}_{HH}'  # downloader.py:306,447
    probsevere_start_after_lookback_hours: 1                    # downloader.py:305,446

  # HTTPS fallback against the NCEP 2D index, used when S3 lookup yields nothing.
  ncep_https:
    base_url: https://mrms.ncep.noaa.gov/data/2D    # https_client.py:24
    probsevere_url: https://mrms.ncep.noaa.gov/data/ProbSevere  # https_client.py:107
    sync_timeout_seconds: 10                        # https_client.py:168
    match_window_seconds: 120                       # https_client.py:228
    download_chunk_size_bytes: 8192                 # https_client.py:261
    # Fallback when a product is absent from directory_map: split on this token
    # and keep the leading segment. https_client.py:96-98
    directory_split_token: '_00.'
    # S3 modifier -> NCEP directory name. Transcribed verbatim from
    # https_client.py:73-90. NOTE: the FLASH_QPE_FFG01H_00.00 key does not match
    # any entry in `products` (the real product is FLASH_QPE_FFGMAX_00.00), so
    # that mapping is dead today; preserved to keep this a faithful transcription.
    directory_map:
      EchoTop_18_00.50: EchoTop_18
      EchoTop_30_00.50: EchoTop_30
      FLASH_QPE_FFG01H_00.00: FLASH
      MESH_00.50: MESH
      NLDN_CG_005min_AvgDensity_00.00: NLDN_CG_005min_AvgDensity
      PrecipRate_00.00: PrecipRate
      RadarOnly_QPE_01H_00.00: RadarOnly_QPE_01H
      MergedAzShear_0-2kmAGL_00.50: MergedAzShear_0-2kmAGL
      MergedAzShear_3-6kmAGL_00.50: MergedAzShear_3-6kmAGL
      VIL_Density_00.50: VIL_Density
      VIL_00.50: VIL
      MergedRhoHV_00.50: MergedRhoHV
      PrecipFlag_00.00: PrecipFlag
      MergedReflectivityAtLowestAltitude_00.50: MergedReflectivityAtLowestAltitude
      MergedReflectivityQCComposite_00.50: MergedReflectivityQCComposite
      VII_00.50: VII

  products:                             # get_mrms_modifiers(), 28 entries {region, product, outdir}
    - {region: CONUS, product: EchoTop_18_00.50,                     outdir: MRMS_ECHOTOP18_DIR}
    - {region: CONUS, product: EchoTop_30_00.50,                     outdir: MRMS_ECHOTOP30_DIR}
    - {region: CONUS, product: EchoTop_50_00.50,                     outdir: MRMS_ECHOTOP50_DIR}
    - {region: CONUS, product: FLASH_CREST_MAXUNITSTREAMFLOW_00.00,  outdir: MRMS_FLASH_CREST_MAXUNIT_DIR}
    - {region: CONUS, product: FLASH_QPE_ARIMAX_00.00,               outdir: MRMS_FLASH_ARIMAX_DIR}
    - {region: CONUS, product: FLASH_QPE_ARI30M_00.00,               outdir: MRMS_FLASH_ARI30M_DIR}
    - {region: CONUS, product: FLASH_QPE_ARI01H_00.00,               outdir: MRMS_FLASH_ARI01H_DIR}
    - {region: CONUS, product: FLASH_HP_MAXUNITSTREAMFLOW_00.00,     outdir: MRMS_FLASH_HP_MAXUNIT_DIR}
    - {region: CONUS, product: FLASH_SAC_MAXSOILSAT_00.00,           outdir: MRMS_FLASH_SAC_MAXSOIL_DIR}
    - {region: CONUS, product: FLASH_QPE_FFGMAX_00.00,               outdir: MRMS_FLASH_FFGMAX_DIR}
    - {region: CONUS, product: RadarQualityIndex_00.00,              outdir: MRMS_RQI_DIR}
    - {region: CONUS, product: MESH_00.50,                           outdir: MRMS_MESH_DIR}
    - {region: CONUS, product: NLDN_CG_005min_AvgDensity_00.00,      outdir: MRMS_NLDN_DIR}
    - {region: CONUS, product: PrecipRate_00.00,                     outdir: MRMS_PRECIPRATE_DIR}
    - {region: CONUS, product: RadarOnly_QPE_01H_00.00,              outdir: MRMS_QPE_DIR}
    - {region: CONUS, product: MergedAzShear_0-2kmAGL_00.50,         outdir: MRMS_AZSHEARLOW_DIR}
    - {region: CONUS, product: MergedAzShear_3-6kmAGL_00.50,         outdir: MRMS_AZSHEARMID_DIR}
    - {region: CONUS, product: VIL_Density_00.50,                    outdir: MRMS_DVIL_DIR}
    - {region: ProbSevere, product: null,                            outdir: MRMS_PROBSEVERE_DIR}
    - {region: CONUS, product: MergedRhoHV_00.50,                    outdir: MRMS_RHOHV_DIR}
    - {region: CONUS, product: PrecipFlag_00.00,                     outdir: MRMS_PRECIPTYP_DIR}
    - {region: CONUS, product: MergedReflectivityAtLowestAltitude_00.50, outdir: MRMS_RALA_DIR}
    - {region: CONUS, product: MergedReflectivityQCComposite_00.50,  outdir: MRMS_COMPOSITE_DIR}
    - {region: CONUS, product: VII_00.50,                            outdir: MRMS_VII_DIR}
    - {region: CONUS, product: VIL_00.50,                            outdir: MRMS_VIL_DIR}
    - {region: CONUS, product: Reflectivity_0C_00.50,                outdir: MRMS_REF_0C_DIR}
    - {region: CONUS, product: Reflectivity_-5C_00.50,               outdir: MRMS_REFM5C_DIR}
    - {region: CONUS, product: Reflectivity_-15C_00.50,              outdir: MRMS_REFM15C_DIR}

  # get_check_modifiers(), a 12-entry subset of `products`. Same triple shape --
  # the readiness checker needs the outdir, not just the product name.
  check_products:
    - {region: CONUS, product: EchoTop_18_00.50,                     outdir: MRMS_ECHOTOP18_DIR}
    - {region: CONUS, product: EchoTop_30_00.50,                     outdir: MRMS_ECHOTOP30_DIR}
    - {region: CONUS, product: EchoTop_50_00.50,                     outdir: MRMS_ECHOTOP50_DIR}
    - {region: CONUS, product: PrecipRate_00.00,                     outdir: MRMS_PRECIPRATE_DIR}
    - {region: CONUS, product: MergedAzShear_0-2kmAGL_00.50,         outdir: MRMS_AZSHEARLOW_DIR}
    - {region: CONUS, product: MergedAzShear_3-6kmAGL_00.50,         outdir: MRMS_AZSHEARMID_DIR}
    - {region: CONUS, product: VIL_Density_00.50,                    outdir: MRMS_DVIL_DIR}
    - {region: ProbSevere, product: null,                            outdir: MRMS_PROBSEVERE_DIR}
    - {region: CONUS, product: PrecipFlag_00.00,                     outdir: MRMS_PRECIPTYP_DIR}
    - {region: CONUS, product: MergedReflectivityAtLowestAltitude_00.50, outdir: MRMS_RALA_DIR}
    - {region: CONUS, product: MergedReflectivityQCComposite_00.50,  outdir: MRMS_COMPOSITE_DIR}
    - {region: CONUS, product: VII_00.50,                            outdir: MRMS_VII_DIR}

  # Only the detection list is a literal (main.py:21). The integration, ewmrs, and
  # ewmrs_support lists are derived from it plus `products` and the render layer
  # set (main.py:24-42) and must stay derived so they cannot drift.
  membership_lists:
    detection: [MergedReflectivityQCComposite_00.50, PrecipFlag_00.00, null]

goes:
  # These four are read per call, via config.py goes_bucket(), abi_radc_product()
  # and _abi_channel_definitions(). See the note on `mrms.bucket` for why binding
  # them at module scope put them out of reach of --config-dir.
  bucket: noaa-goes19
  abi_product: ABI-L1b-RadC
  glm_product: GLM-L2-LCFA               # config.py get_goes_modifiers()
  glm_outdir: GOES_GLM_DIR               # config.py get_goes_modifiers()
  # The retained-file count cap per GOES spec, resolved in
  # GoesIngestSpec.__post_init__ rather than as a field default -- a dataclass
  # default is evaluated once, at class-definition time. A caller may still pass
  # max_files explicitly, including None, which means "no cap" to
  # util.file.clean_old_files.
  max_files_per_spec: 2
  # downloader.py _goes_search_max_entries(). The listing depth for every GOES
  # lookup, and the only one -- no GOES entry point takes a per-call count.
  # GLM publishes roughly 180 objects an hour, so the MRMS depth in
  # runtime.yaml (`cycle.ingest_max_entries`, 10) would never list back to the
  # requested scan.
  max_entries: 96
  # Unlike max_entries above, this is still a per-call parameter and is not
  # read from here: the five GOES download entry points in downloader.py each
  # default `hour_lookback` to 3, and a caller may narrow it. Recorded so the
  # catalog names the operative value.
  hour_lookback: 3
  cleanup_max_age_minutes: 60            # main.py:57
  bucket_path_pattern: '{product}/{YYYY}/{DDD}/{HH}/'  # parse.py:53
  filename_matcher_template: '(?:_|-)M\d{channel_id}_' # config.py get_abi_radc_channel_specs()
  # 16 channels. `get_abi_radc_channel_specs(channel_ids=None)` selects all of
  # them; passing an explicit list narrows the selection. The catalog order is the
  # spec order.
  abi_channels:
    - {id: C01, name: visible_blue,     outdir: GOES_ABI_VISIBLE_BLUE_DIR}
    - {id: C02, name: visible_red,      outdir: GOES_ABI_VISIBLE_RED_DIR}
    - {id: C03, name: veggie,           outdir: GOES_ABI_VEGGIE_DIR}
    - {id: C04, name: cirrus,           outdir: GOES_ABI_CIRRUS_DIR}
    - {id: C05, name: snow_ice,         outdir: GOES_ABI_SNOW_ICE_DIR}
    - {id: C06, name: particle_size,    outdir: GOES_ABI_PARTICLE_SIZE_DIR}
    - {id: C07, name: shortwave_ir,     outdir: GOES_ABI_SHORTWAVE_IR_DIR}
    - {id: C08, name: upper_level_wv,   outdir: GOES_ABI_UPPER_LEVEL_WV_DIR}
    - {id: C09, name: mid_level_wv,     outdir: GOES_ABI_MID_LEVEL_WV_DIR}
    - {id: C10, name: lower_level_wv,   outdir: GOES_ABI_LOWER_LEVEL_WV_DIR}
    - {id: C11, name: cld_top_phase,    outdir: GOES_ABI_CLD_TOP_PHASE_DIR}
    - {id: C12, name: ozone,            outdir: GOES_ABI_OZONE_DIR}
    - {id: C13, name: clean_lwir,       outdir: GOES_ABI_CLEAN_LWIR_DIR}
    - {id: C14, name: longwave_ir,      outdir: GOES_ABI_LONGWAVE_IR_DIR}
    - {id: C15, name: dirty_lwir,       outdir: GOES_ABI_DIRTY_LWIR_DIR}
    - {id: C16, name: co2_lwir,         outdir: GOES_ABI_CO2_LWIR_DIR}
