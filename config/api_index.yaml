# api_index.yaml — Audit §6
#
# Consumed through src/EdgeWARN/api_integration/config.py, which reads this file
# per call so a --config-dir resolved after import still applies. Every key below
# is the single owner of its default; no literal in the index manager or either
# pipeline competes with it. The one exception is resync_every_updates, which has
# no accessor at all -- see its own comment for why.
#
# Split out of alerts.yaml, which held these values only because the audit grouped
# them there. Nothing here concerns alerts: this is the index the API serves.

schema_version: 1

api_index:
  # SPLIT because the two pipelines disagree. `realtime` is the default every
  # declaration site resolves to when a caller passes nothing, which is what the
  # realtime tandem worker does; historical_pipeline passes `historical`
  # explicitly. One key could not record both.
  remove_old_cells:
    realtime: true
    historical: false

  # Whether initialize_runtime bootstraps the index at startup. The same
  # realtime/historical split as above and for the same reason: a replay reuses
  # whatever the realtime run indexed rather than rebuilding it.
  #
  # This was recorded under alerts.yaml as `runtime.initialize_indexes`, which
  # read as a runtime concern. It gates APIIndexManager.initialize_indexes(), so
  # the owner is this subsystem.
  initialize_at_startup:
    realtime: true
    historical: false

  # Updates between full directory resyncs, which reconcile deletions.
  #
  # NOT READ BY CODE TODAY, and that is deliberate rather than an oversight. An
  # interval only means something if the counter survives more than one update,
  # and it cannot: the only path reaching update_stormcell_index is detection, and
  # src/util/runtime/cycle.py starts edgewarn_tandem_worker in a fresh
  # multiprocessing.Process for every cycle. Each update therefore begins with a
  # zeroed counter no matter what scope the manager is hoisted into, so
  # update_stormcell_index rescans the directory every time -- which is also
  # exactly what it did while the counter existed.
  #
  # 128 rather than the previous 500 because 500 was a literal in code that never
  # ran and so was never validated against anything. 128 is the interval to adopt
  # if the index commit is ever moved somewhere that outlives one cycle: either
  # the long-lived loop in src/run.py, or by persisting the counter into
  # stormcell_index.json (whose only external reader, src/api/services/analysis.js,
  # takes `timestamps` and ignores other fields).
  resync_every_updates: 128

  # Age budget in cleanup_inactive_cells, converted to seconds at the use site.
  #
  # The alert-file cleanup age that used to sit beside this in alerts.yaml is
  # gone: CTAM alert extraction is deferred, so manager.py's `120` is once again
  # the sole owner of that separate concern. The two were never one knob.
  inactive_cell_max_age_minutes: 120
