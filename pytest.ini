[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add options
addopts = 
    -v
    --tb=short
    --strict-markers
    --ignore=tests/api

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may use external resources)
    e2e: End-to-end tests (full system)
    slow: Slow tests (> 1 second)
    api: API-related tests
    ingest: Data ingestion tests
    process: Data processing tests
    ctam: CTAM module tests

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage configuration (requires pytest-cov)
# Uncomment to enable coverage reporting
# addopts = -v --tb=short --strict-markers --cov=src --cov-report=term-missing
